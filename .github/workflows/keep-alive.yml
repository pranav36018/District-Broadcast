name: Keep Render Server Awake 24/7

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Connect Karnataka Health Endpoint
        run: curl -s -o /dev/null -w "%{http_code}" https://district-broadcast.onrender.com/api/health
